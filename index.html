let active='up',group='',query='',savedOnly=false;const saved=new Set();const $=id=>document.getElementById(id);const strip=s=>s.replace(/<[^>]+>/g,'');function refreshNav(){ $('nav').innerHTML=categories.map((c,i)=>`<button type="button" data-cat="${c.id}" class="${active===c.id?'active':''}" aria-pressed="${active===c.id}"><b>${String(i+1).padStart(2,'0')} · ${c.zh}</b><small>${c.en}</small></button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{active=b.dataset.cat;group='';query='';$('search').value='';savedOnly=false;render()})}function render(){refreshNav();const cat=categories.find(c=>c.id===active);$('eyebrow').textContent=cat.en.toUpperCase();$('title').textContent=cat.zh;$('intro').textContent=cat.intro;$('foot').textContent=cat.foot;const groups=[...new Set(entries.filter(e=>e[0]===active).map(e=>e[1]))];$('groupFilter').innerHTML='<option value="">所有子分類</option>'+groups.map(g=>`<option value="${g}">${g}</option>`).join('');$('groupFilter').value=group;$('savedButton').classList.toggle('active',savedOnly);$('savedButton').setAttribute('aria-pressed',String(savedOnly));$('savedNum').textContent=saved.size;const list=entries.filter((e,i)=>e[0]===active&&(!group||e[1]===group)&&(!savedOnly||saved.has(entries.indexOf(e)))&&(!query||[e[2],e[3],strip(e[4]),e[5]].join(' ').toLowerCase().includes(query.toLowerCase())));$('count').textContent=`${list.length} / ${entries.filter(e=>e[0]===active).length} 項`;let html='';for(const g of groups){const items=list.filter(e=>e[1]===g);if(!items.length)continue;html+=`<div class="group"><div class="group-head"><span>${String(groups.indexOf(g)+1).padStart(2,'0')}</span><strong>${g}</strong></div>`;for(const e of items){const idx=entries.indexOf(e);html+=`<article class="entry"><div class="word">${e[2]}</div><div class="meaning">${e[3]}</div><div class="example">${e[4]}${e[5]?`<div class="extra">${e[5]}</div>`:''}</div><button class="star ${saved.has(idx)?'on':''}" data-save="${idx}" title="收藏 / 取消收藏" aria-label="收藏 ${e[2]}" aria-pressed="${saved.has(idx)}">${saved.has(idx)?'★':'☆'}</button></article>`}html+='</div>'} $('results').innerHTML=html||'<div class="empty">沒有符合的項目，請調整搜尋或篩選。</div>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const n=+b.dataset.save;saved.has(n)?saved.delete(n):saved.add(n);render()})} $('groupFilter').onchange=e=>{group=e.target.value;render()};$('search').oninput=e=>{query=e.target.value;render()};$('savedButton').onclick=()=>{savedOnly=!savedOnly;render()};$('clearButton').onclick=()=>{group='';query='';savedOnly=false;$('search').value='';render()};const quiz=[{q:'Sales increased ___ 20%.',choices:['by','to','at'],correct:'by',why:'by 表示「變化幅度」。'},{q:'Sales peaked ___ 500 units.',choices:['of','at','to'],correct:'at',why:'peak 當動詞時搭配 at。'},{q:'There was an increase ___ 20%.',choices:['by','of','at'],correct:'of',why:'an increase 是名詞，描述幅度時用 of。'},{q:'Sales fluctuated ___ 100 and 200.',choices:['between','around','from'],correct:'between',why:'between A and B 表示波動範圍。'},{q:'Sales rose steadily ___ the decade.',choices:['at','over','to'],correct:'over',why:'over 強調跨越一段時間的變化。'}];let qi=0;function renderQuiz(){const q=quiz[qi];$('question').textContent=q.q;$('answer').textContent='';$('choices').innerHTML=q.choices.map(x=>`<button type="button" data-choice="${x}">${x}</button>`).join('');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-choice]').forEach(c=>{c.disabled=true;if(c.dataset.choice===q.correct)c.classList.add('correct');else if(c===b)c.classList.add('wrong')});$('answer').innerHTML=(b.dataset.choice===q.correct?'✓ 正確。':'再記一次：')+q.why+' <button id="nextQ" style="border:0;background:none;color:var(--dark);text-decoration:underline;font-weight:bold">下一題 →</button>';$('nextQ').onclick=()=>{qi=(qi+1)%quiz.length;renderQuiz()}})}render();renderQuiz();
